# https://docs.opensearch.org/latest/install-and-configure/install-opensearch/docker
services:

  opensearch:
    container_name: local-opensearch
    image: opensearchproject/opensearch:3.2.0
    hostname: opensearch
    networks:
      - local_network
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      # disables JVM heap memory swapping
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./tmp/opensearch:/usr/share/opensearch/data

  dashboards:
    container_name: local-opensearch-dashboards
    image: opensearchproject/opensearch-dashboards:3.2.0
    depends_on:
      - opensearch
    restart: on-failure
    networks:
      - local_network
    ports:
      - 5601:5601
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

networks:
  local_network:
